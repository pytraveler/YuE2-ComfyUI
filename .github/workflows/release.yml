name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag and pyproject.toml must agree
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag $GITHUB_REF_NAME -> $tagged, pyproject.toml says $declared"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version = \"$declared\" in pyproject.toml"
            exit 1
          fi
          echo "VERSION=$tagged" >> "$GITHUB_ENV"

      - name: Release notes out of the changelogs
        run: |
          section() { awk -v v="$VERSION" 'index($0, "## " v " - ") == 1 {f=1; next} f && /^## / {exit} f {print}' "$1"; }
          section CHANGELOG.md > /tmp/en.md
          section CHANGELOG_RU.md > /tmp/ru.md
          if [ ! -s /tmp/en.md ] || [ ! -s /tmp/ru.md ]; then
            echo "::error::no section for $VERSION in CHANGELOG.md or CHANGELOG_RU.md"
            exit 1
          fi
          { cat /tmp/en.md; echo; echo "---"; echo; cat /tmp/ru.md; } > /tmp/notes.md
          cat /tmp/notes.md

      - name: The suite passes, which is also where the source-style rules live
        run: |
          python -m pip install --quiet --upgrade pip pytest
          python -m pytest tests -q

      - name: The pack compiles and the nodes load
        run: |
          python -m compileall -q __init__.py yue2_comfy
          python - <<'PY'
          import pathlib
          import sys
          import types

          package = "yue2_comfy"
          module = types.ModuleType(package)
          module.__path__ = [str(pathlib.Path(package).resolve())]
          sys.modules[package] = module

          from yue2_comfy.nodes import (NODE_CLASS_MAPPINGS,
                                        NODE_DISPLAY_NAME_MAPPINGS)

          assert NODE_CLASS_MAPPINGS, "NODE_CLASS_MAPPINGS is empty"
          unnamed = sorted(set(NODE_CLASS_MAPPINGS) - set(NODE_DISPLAY_NAME_MAPPINGS))
          assert not unnamed, "no display name for {}".format(unnamed)
          for name, cls in sorted(NODE_CLASS_MAPPINGS.items()):
              cls.INPUT_TYPES()
          print("{} nodes:".format(len(NODE_CLASS_MAPPINGS)),
                ", ".join(sorted(NODE_CLASS_MAPPINGS)))
          PY

      - name: Pack the archive
        run: |
          name="YuE2-ComfyUI"
          mkdir -p dist
          git archive --format=zip --prefix="$name/" -o "dist/$name-$VERSION.zip" "$GITHUB_REF_NAME"
          echo "ARCHIVE=dist/$name-$VERSION.zip" >> "$GITHUB_ENV"
          echo "PREFIX=$name" >> "$GITHUB_ENV"

      - name: What is in the archive, and what is not
        run: |
          listed=$(unzip -Z1 "$ARCHIVE")
          echo "$listed"
          for bad in "uv\.exe" "\.venv/" "dev-junction" "comfyui-path\.txt" "\.mcp\.json" \
                     "__pycache__" "\.github/" "\.gitignore" "\.gitattributes" "^$PREFIX/tools/"; do
            if echo "$listed" | grep -qE -- "$bad"; then
              echo "::error::$ARCHIVE contains something matching $bad"
              exit 1
            fi
          done
          for needed in __init__.py pyproject.toml requirements.txt \
                        LICENSE NOTICE.md README.md README_RU.md \
                        CHANGELOG.md CHANGELOG_RU.md \
                        locales/ru/main.json locales/ru/nodeDefs.json \
                        yue2_comfy/nodes.py yue2_comfy/constants.py \
                        yue2_comfy/generate.py yue2_comfy/loader.py \
                        yue2_comfy/download.py yue2_comfy/llm.py \
                        yue2_comfy/staged.py yue2_comfy/manifest.py \
                        yue2_comfy/routes.py yue2_comfy/tokens.py \
                        yue2_comfy/placement.py yue2_comfy/transpose.py \
                        yue2_comfy/notation.py yue2_comfy/edits.py \
                        web/js/yue2_editor.js web/js/yue2_sheet.js \
                        web/js/yue2_controls.js web/js/yue2_score.js \
                        web/js/yue2_roll.js web/js/yue2_notices.js \
                        web/js/vendor/abcjs-basic-min.cjs \
                        web/js/vendor/abcjs-LICENSE.md \
                        yue2_comfy/vendor/yue2/protocol.py \
                        yue2_comfy/vendor/yue2_music/abc_tools.py \
                        tests/data/model_scores.json; do
            echo "$listed" | grep -qxF "$PREFIX/$needed" || {
              echo "::error::$needed is missing from $ARCHIVE"
              exit 1
            }
          done
          for stem in "1 - A song from one line" \
                      "2 - A song from style and lyrics" \
                      "3 - A longer song" \
                      "4 - The score first" \
                      "5 - Four scores, one song" \
                      "6 - One take, both decoders"; do
            for needed in "example_workflows/$stem.json" "example_workflows/$stem.jpg"; do
              echo "$listed" | grep -qxF "$PREFIX/$needed" || {
                echo "::error::$needed is missing from $ARCHIVE"
                exit 1
              }
            done
          done
          echo "checked: the nodes, the vendored model code, the locales, the"
          echo "changelogs and the example workflows with their cards are in, the"
          echo "development tools and the local state are not"

      - name: The archive passes its own suite after being unpacked
        run: |
          rm -rf /tmp/unpacked
          mkdir -p /tmp/unpacked
          unzip -q "$ARCHIVE" -d /tmp/unpacked
          cd "/tmp/unpacked/$PREFIX"
          python -m compileall -q __init__.py yue2_comfy
          python -m pytest tests -q

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" \
            --title "YuE2-ComfyUI $VERSION" \
            --notes-file /tmp/notes.md \
            --verify-tag
