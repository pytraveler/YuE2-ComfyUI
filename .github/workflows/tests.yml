name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest and nothing else
        run: python -m pip install --quiet --upgrade pip pytest

      - name: The suite runs without ComfyUI, torch or the weights
        run: python -m pytest tests -q

      - name: The pack compiles
        run: python -m compileall -q __init__.py yue2_comfy tools

  style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest and nothing else
        run: python -m pip install --quiet --upgrade pip pytest

      - name: ASCII only, docstrings rather than comments, translations intact
        run: python -m pytest tests/test_source_style.py tests/test_locales.py -q
